<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Defense Contract Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f5f8b%22/%3E%3Cpath d=%22M4 11V7M8 11V4M12 11V8%22 stroke=%22white%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="wrap" style="max-width:460px;padding-top:64px">
  <p><a href="/">← Defense Contract Tracker</a></p>
  <div>
    <h2>Admin sign-in</h2>
    {% if configured %}
    <form method="post">
      <label for="token">Admin token (from your .env file)</label>
      <input type="password" id="token" name="token" autocomplete="current-password" required style="width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface)">
      <p style="margin-top:14px"><button class="btn primary" type="submit">Sign in</button></p>
    </form>
    {% else %}
    <p>No <code>ADMIN_TOKEN</code> is set in <code>.env</code>, so the admin page is turned off.</p>
    {% endif %}
  </div>
</main>
</body>
</html>
